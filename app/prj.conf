# STM32U585 IoT Discovery Kit (b_u585i_iot02a) Configuration

# Basic peripherals
CONFIG_GPIO=y

# Console and debugging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# CPU usage monitoring (supported on STM32U585)
CONFIG_CPU_LOAD=y

# System heap - STM32U585 has 786KB SRAM, so this is safe
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# STM32U585 Power Management - Well supported
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Enable custom PM policy to set default behavior
CONFIG_PM_POLICY_CUSTOM=y

# STM32U585 supports these power modes
#CONFIG_PM_STATE_SUSPEND_TO_IDLE_SUPPORTED=y
#CONFIG_PM_STATE_STANDBY_SUPPORTED=y

# Logging for PM debugging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# STM32 specific optimizations
# CONFIG_SOC_FAMILY_STM32=y
# CONFIG_SOC_SERIES_STM32U5X=y

# Enable system workqueue for delayed work (needed for k_work_schedule)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Clock configuration for better power management
CONFIG_CLOCK_CONTROL=y

# Flash controller for power management
CONFIG_FLASH=y
